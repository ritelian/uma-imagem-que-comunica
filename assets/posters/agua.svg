<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" role="img" aria-labelledby="t d"><title id="t">Cada gota conta</title><desc id="d">Cartaz azul: uma gota verde contém uma pequena planta. Incentiva a fechar a torneira enquanto se escovam os dentes.</desc><rect width="600" height="800" fill="#3046e9"/><text x="42" y="55" fill="#ddf779" font-family="Arial,sans-serif" font-size="15" letter-spacing="3">PEQUENOS GESTOS. UM FUTURO.</text><path d="M300 108C258 185 153 279 153 362a147 147 0 0 0 294 0c0-83-105-177-147-254Z" fill="#ddf779"/><path d="M300 446V288M299 381c-71 0-86-43-88-74 56 0 88 25 88 74ZM301 338c61 0 78-40 80-69-48 0-80 20-80 69Z" stroke="#20211f" stroke-width="8" fill="#20211f" stroke-linecap="round"/><text x="42" y="580" fill="#fffdf1" font-family="Arial,sans-serif" font-size="73" font-weight="900" letter-spacing="-4">CADA GOTA</text><text x="42" y="653" fill="#ddf779" font-family="Arial,sans-serif" font-size="83" font-weight="900" letter-spacing="-4">CONTA.</text><path d="M42 688H558" stroke="#8896ff"/><text x="42" y="722" fill="#fffdf1" font-family="Arial,sans-serif" font-size="22">Fecha a torneira enquanto</text><text x="42" y="752" fill="#fffdf1" font-family="Arial,sans-serif" font-size="22">escovas os dentes.</text></svg>